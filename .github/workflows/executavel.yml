name: Gerar executável Windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Copiar o jogo para dentro do app
        shell: bash
        run: cp -r game app/game
      - name: Empacotar
        working-directory: app
        run: |
          npm install
          npx @electron/packager . HotelLosSegredos --platform=win32 --arch=x64 --out=../dist --overwrite
      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path dist/HotelLosSegredos-win32-x64 -DestinationPath HotelLosSegredos_Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: HotelLosSegredos_Windows, path: HotelLosSegredos_Windows.zip }
      - name: Publicar na aba Releases (só em tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: HotelLosSegredos_Windows.zip }
